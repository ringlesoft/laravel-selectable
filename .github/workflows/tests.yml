name: Tests

on:
  push:
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            illuminate: '^9.0'
          - php: '8.1'
            illuminate: '^10.0'
          - php: '8.2'
            illuminate: '^11.0'
          - php: '8.2'
            illuminate: '^12.0'
          - php: '8.3'
            illuminate: '^13.0'
    name: PHP ${{ matrix.php }} / Illuminate ${{ matrix.illuminate }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer require --dev --no-interaction --no-update illuminate/collections:${{ matrix.illuminate }} illuminate/support:${{ matrix.illuminate }}
      - run: composer update --with-all-dependencies --prefer-dist --no-interaction
      - run: composer test
